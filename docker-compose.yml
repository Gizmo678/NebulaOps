version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nebulaops-postgres
    environment:
      POSTGRES_DB: nebulaops
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nebulaops-network

  prometheus:
    image: prom/prometheus:latest
    container_name: nebulaops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - nebulaops-network

  grafana:
    image: grafana/grafana:latest
    container_name: nebulaops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - nebulaops-network

  redis:
    image: redis:7-alpine
    container_name: nebulaops-redis
    ports:
      - "6379:6379"
    networks:
      - nebulaops-network

volumes:
  postgres_data:

networks:
  nebulaops-network:
    driver: bridge
