<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaOps - Enterprise CI/CD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view active">
            <div class="auth-card glass">
                <div class="brand">
                    <div class="logo"></div>
                    <h1>NebulaOps</h1>
                    <p>Enterprise CI/CD Platform</p>
                </div>
                <form id="auth-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="auth-btn">Log In</button>
                    <p class="toggle-auth">Need an account? <span id="toggle-register">Register</span></p>
                </form>
                <div id="auth-error" class="error-msg"></div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <nav class="navbar glass">
                <div class="brand-small">
                    <div class="logo-small"></div>
                    <h2>NebulaOps</h2>
                </div>
                <div class="nav-actions">
                    <span id="user-display"></span>
                    <button id="logout-btn" class="btn-outline">Logout</button>
                </div>
            </nav>

            <main class="dashboard-content">
                <header class="dash-header">
                    <h2>Your Projects</h2>
                    <button id="new-project-btn" class="btn-primary">+ New Project</button>
                </header>

                <div id="projects-grid" class="grid">
                    <!-- Projects injected here -->
                </div>
            </main>
        </div>

        <!-- New Project Modal -->
        <div id="project-modal" class="modal">
            <div class="modal-content glass">
                <h3>Create New Project</h3>
                <form id="project-form">
                    <input type="text" id="proj-name" placeholder="Project Name (e.g. e-commerce-api)" required>
                    <input type="text" id="proj-repo" placeholder="GitHub Repo (e.g. user/repo)" required>
                    <select id="proj-cloud">
                        <option value="Azure App Service">Azure App Service</option>
                        <option value="AWS EC2">AWS EC2</option>
                        <option value="Google Cloud Run">Google Cloud Run</option>
                    </select>
                    <select id="proj-env">
                        <option value="Production">Production</option>
                        <option value="Staging">Staging</option>
                    </select>
                    <div class="modal-actions">
                        <button type="button" id="cancel-project-btn" class="btn-ghost">Cancel</button>
                        <button type="submit" class="btn-primary">Create Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
